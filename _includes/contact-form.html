<form
  id="contact-form"
  action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSd809W-5FtGoAQPut-3tId3AF6p_STEyvVQSjQhzeKaYrnn5A/formResponse"
  method="POST"
  target="hidden_iframe"
  class="contact-form"
  novalidate
>
  <div class="form-row">
    <div class="form-group">
      <label for="name">
        Name <span class="required">*</span>
        <span class="sr-only">required</span>
      </label>
      <input type="text" id="name" name="entry.1655243000" autocomplete="name" required>
    </div>

    <div class="form-group">
      <label for="email">
        Email <span class="required">*</span>
        <span class="sr-only">required</span>
      </label>
      <input type="email" id="email" name="entry.2083704905" autocomplete="email" required>
    </div>
  </div>

  <div class="form-group">
    <fieldset class="service-selector-group">
      <legend class="form-label">What do you need help with? <span class="required">*</span></legend>
      <div class="service-cards">
        <label class="service-card">
          <input type="radio" name="service-type" value="Fix my SEO" required>
          <span class="service-card-icon">&#9906;</span>
          <span class="service-card-title">Fix my SEO</span>
          <span class="service-card-desc">My site exists but isn't ranking</span>
        </label>
        <label class="service-card">
          <input type="radio" name="service-type" value="Build a new website">
          <span class="service-card-icon">&#9998;</span>
          <span class="service-card-title">Build a new website</span>
          <span class="service-card-desc">I need a site built from scratch</span>
        </label>
        <label class="service-card">
          <input type="radio" name="service-type" value="Not sure yet">
          <span class="service-card-icon">&#8226;&#8226;&#8226;</span>
          <span class="service-card-title">Not sure yet</span>
          <span class="service-card-desc">Just exploring my options</span>
        </label>
      </div>
    </fieldset>
  </div>

  <div class="form-group">
    <fieldset class="checkbox-group-fieldset">
      <legend class="form-label">Preferred contact method</legend>

      <label class="checkbox">
        <input type="radio" name="entry.162991437" value="Email" checked>
        <span class="checkbox-ui" aria-hidden="true"></span>
        <span>Email</span>
      </label>

      <label class="checkbox">
        <input type="radio" name="entry.162991437" value="Whatsapp">
        <span class="checkbox-ui" aria-hidden="true"></span>
        <span>WhatsApp</span>
      </label>
    </fieldset>
  </div>

  <div class="form-group">
    <label for="message">
      Message <span class="required">*</span>
      <span class="sr-only">required</span>
    </label>
    <textarea id="message" name="entry.1755926505" rows="7" required></textarea>
  </div>

  <input type="text" name="_gotcha" class="honeypot">

  <div class="form-actions">
    <button type="submit" class="submit-btn">Send message</button>
    <div id="form-status" class="form-status" role="status" aria-live="polite"></div>
  </div>
</form>

<iframe
  name="hidden_iframe"
  style="display:none"
  aria-hidden="true"
></iframe>
